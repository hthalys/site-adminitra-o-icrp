<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09150d"><title>Infinity City RP | Painel Administrativo</title>
<style>
:root{--bg:#08130c;--panel:#102016;--panel2:#15291b;--line:#294331;--green:#83e653;--yellow:#e8ca4d;--text:#edf5ee;--muted:#9bb09e;--red:#e87979}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1b3b22,transparent 34%),var(--bg);color:var(--text);font:14px system-ui,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:#0a170d;font-weight:800}.btn.alt{background:#24442c;color:var(--text);border:1px solid #365b3d}.btn.warn{background:var(--yellow);color:#191807}.btn.del{background:#542929;color:#ffe1e1}.btn.sm{padding:7px 10px;font-size:12px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);padding:30px;border-radius:22px}.mark{width:54px;height:54px;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--yellow));color:#102016;border-radius:15px;font-weight:1000;font-size:22px}.eyebrow{color:var(--green);letter-spacing:2px;font-size:11px;font-weight:900;margin-top:20px}.muted{color:var(--muted)}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:#b8caba;font-weight:700}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;background:#09170e;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green)}.error{color:#ff9d9d;min-height:18px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;background:#0b180f;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;margin-bottom:22px}.brand .mark{width:42px;height:42px;font-size:17px}.brand strong{font-size:13px;letter-spacing:1px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}.navlabel{color:#718b76;font-size:10px;letter-spacing:1.5px;font-weight:900;padding:12px 8px 7px}.nav button{width:100%;border:0;background:transparent;color:#b2c3b5;text-align:left;padding:11px;border-radius:9px;margin:2px 0;font-weight:650}.nav button.active,.nav button:hover{background:#1b3822;color:var(--green)}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding-top:13px}.main{min-width:0}.top{height:68px;position:sticky;top:0;background:#0b180feF;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;z-index:3}.top h2{font-size:17px}.content{max-width:1450px;margin:auto;padding:25px}.welcome{background:linear-gradient(110deg,#1a3921,#12251a 70%,#2a3019);border:1px solid #365b3d;border-radius:17px;padding:23px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.welcome h1{margin:8px 0;font-size:25px}.welcome p{margin:0;color:#b8caba}.tag{font-size:10px;color:var(--yellow);letter-spacing:2px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:17px 0 22px}.stat,.card{background:linear-gradient(145deg,#13251a,#0e1c13);border:1px solid var(--line);border-radius:14px;padding:17px}.stat small{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1px}.stat strong{display:block;color:var(--green);font-size:29px;margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:15px 0}.head h3,.card h3{margin:0 0 10px;font-size:16px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0a180f;border:1px solid #243c2b;border-radius:10px;padding:12px}.item strong{font-size:13px}.item small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.badge{display:inline-block;border-radius:20px;padding:5px 8px;background:#1e3b25;color:var(--green);font-size:10px;font-weight:850}.badge.y{background:#3c361c;color:var(--yellow)}.badge.r{background:#452323;color:#ffaaaa}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input{max-width:290px}.toolbar select{max-width:190px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:700px;background:#0d1b12}th,td{text-align:left;padding:12px;border-bottom:1px solid #22392a;font-size:12px}th{font-size:10px;color:#91a995;letter-spacing:1px}tr:last-child td{border:0}.actions{display:flex;gap:5px}.empty{text-align:center;padding:22px;color:var(--muted)}.modalbg{position:fixed;inset:0;background:#000b;z-index:9;display:grid;place-items:center;padding:15px}.modal{background:#102016;border:1px solid #426849;border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:20px}.modalhead,.modalfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}.modalfoot{justify-content:flex-end;margin-top:15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span{grid-column:1/-1}.notice{background:#302c19;border:1px solid #5d5126;color:#eadb9b;padding:11px;border-radius:10px;font-size:12px;line-height:1.5;margin:12px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:85px;background:#0b190f;border:1px solid var(--line);border-radius:9px;padding:7px;font-size:11px}.day b{color:var(--green)}.day small{display:block;color:var(--yellow);margin-top:5px;overflow-wrap:anywhere}.dayname{text-align:center;color:var(--muted);padding:7px;font-size:10px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin-bottom:8px}.nav{display:flex;overflow:auto;gap:4px}.navlabel{display:none}.nav button{white-space:nowrap;width:auto}.sidefoot{display:none}.top{height:58px;padding:0 14px}.content{padding:15px}.grid2{grid-template-columns:1fr}}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat strong{font-size:24px}.welcome{padding:17px}.welcome h1{font-size:21px}.welcome .btn{display:none}.formgrid{grid-template-columns:1fr}.span{grid-column:auto}.content{padding:12px}.calendar{gap:3px}.day{min-height:68px;padding:4px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="mark">IC</div><div class="eyebrow">INFINITY CITY RP</div><h1 id="loginTitle">Painel Administrativo</h1><p class="muted" id="loginDesc">Acesso restrito à equipe autorizada.</p><div id="firstNotice" class="notice hidden">Primeiro acesso: crie a conta principal da Diretoria. Guarde sua senha em local seguro.</div><form id="loginForm"><div class="field"><label>Usuário</label><input id="username" required autocomplete="username"></div><div class="field"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"></div><div class="field hidden" id="confirmWrap"><label>Confirmar senha</label><input id="confirm" type="password"></div><div id="loginError" class="error"></div><button class="btn" style="width:100%" id="loginSubmit">ENTRAR NO PAINEL</button></form><p class="muted" style="font-size:11px;margin-top:18px">Onde cada escolha constrói seu legado.</p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand"><div class="mark">IC</div><div><strong>INFINITY CITY</strong><small>PAINEL ADMINISTRATIVO</small></div></div><div class="navlabel">GERENCIAMENTO</div><nav class="nav" id="nav"><button class="active" data-page="dashboard">⌂ &nbsp; Visão geral</button><button data-page="admins">♙ &nbsp; Equipe administrativa</button><button data-page="calendar">▦ &nbsp; Calendário</button><button data-page="notes">▤ &nbsp; Anotações</button><button data-page="activities">◷ &nbsp; Atividades</button><button data-page="reports">▥ &nbsp; Relatórios</button><button data-page="settings">⚙ &nbsp; Configurações</button></nav><div class="sidefoot"><div class="muted" id="who" style="font-size:12px;margin-bottom:10px"></div><button class="btn alt" id="logout" style="width:100%">Sair da conta</button></div></aside><main class="main"><header class="top"><h2 id="title">Visão geral</h2><div><span class="badge">● DADOS LOCAIS</span> <button class="btn alt" id="backupTop">Backup</button></div></header><div class="content" id="content"></div></main></div>
<div id="modalRoot"></div><input id="importFile" type="file" accept=".json,application/json" class="hidden">
<script>
(()=>{'use strict';
const KEY='icrp_site_panel_v1',ROLES=['Helper','Leader Helper','Admin Level 1','Admin Level 2','Admin Level 3','Admin Sênior','Admin Leader','Admin Staff'], $=id=>document.getElementById(id);
const fresh=()=>({account:null,admins:[],notes:[],events:[],activities:[],settings:{community:'Infinity City RP'}});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}let user='',page='dashboard';
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
async function hash(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(s){let e=document.createElement('div');e.textContent=s;e.style.cssText='position:fixed;bottom:20px;right:20px;background:#24442c;border:1px solid #547d5b;padding:12px 17px;border-radius:10px;z-index:20';document.body.append(e);setTimeout(()=>e.remove(),2500)}
function loginView(){ $('login').classList.remove('hidden');$('app').classList.add('hidden');let first=!data.account;$('firstNotice').classList.toggle('hidden',!first);$('confirmWrap').classList.toggle('hidden',!first);$('loginTitle').textContent=first?'Criar acesso da Diretoria':'Painel Administrativo';$('loginDesc').textContent=first?'Configure a primeira conta para proteger o painel.':'Acesso restrito à equipe autorizada.';$('loginSubmit').textContent=first?'CRIAR CONTA E ENTRAR':'ENTRAR NO PAINEL'}
$('loginForm').onsubmit=async e=>{e.preventDefault();let u=$('username').value.trim(),p=$('password').value;$('loginError').textContent='';if(p.length<8){$('loginError').textContent='Use uma senha com pelo menos 8 caracteres.';return}if(!data.account){if(p!==$('confirm').value){$('loginError').textContent='As senhas não coincidem.';return}data.account={username:u,hash:await hash(p)};save()}else if(u!==data.account.username||await hash(p)!==data.account.hash){$('loginError').textContent='Usuário ou senha incorretos.';return}user=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Conectado: '+user;render()};
$('logout').onclick=loginView;$('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()};$('backupTop').onclick=backup;
function stats(){return {total:data.admins.length,active:data.admins.filter(x=>x.status==='Ativo').length,absent:data.admins.filter(x=>x.status==='Em ausência').length,notes:data.notes.length}}
function render(){let c=$('content'),s=stats(),titles={dashboard:'Visão geral',admins:'Equipe administrativa',calendar:'Calendário',notes:'Anotações',activities:'Atividades',reports:'Relatórios',settings:'Configurações'};$('title').textContent=titles[page];
if(page==='dashboard')c.innerHTML=`<section class="welcome"><div><div class="tag">CENTRAL DE GERENCIAMENTO</div><h1>Bem-vindo à Infinity City RP</h1><p>Organização e acompanhamento da equipe administrativa.</p></div><button class="btn warn" onclick="openAdmin()">+ Adicionar administrador</button></section><div class="stats"><div class="stat"><small>ADMINISTRADORES</small><strong>${s.total}</strong></div><div class="stat"><small>ATIVOS</small><strong>${s.active}</strong></div><div class="stat"><small>EM AUSÊNCIA</small><strong>${s.absent}</strong></div><div class="stat"><small>ANOTAÇÕES</small><strong>${s.notes}</strong></div></div><div class="grid2"><section class="card"><div class="head"><h3>Equipe administrativa</h3><button class="btn alt sm" onclick="go('admins')">Ver equipe</button></div><div class="list">${data.admins.slice(0,5).map(row).join('')||'<div class="empty">Nenhum administrador cadastrado.</div>'}</div></section><section class="card"><div class="head"><h3>Próximos compromissos</h3><button class="btn alt sm" onclick="go('calendar')">Calendário</button></div><div class="list">${data.events.filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(x=>`<div class="item"><div><strong>${esc(x.title)}</strong><small>${fmt(x.date)} ${esc(x.time||'')}</small></div><span class="badge y">Agenda</span></div>`).join('')||'<div class="empty">Nenhum compromisso futuro.</div>'}</div></section></div><div class="head"><h3>Atividades recentes</h3><button class="btn alt sm" onclick="go('activities')">Ver histórico</button></div><section class="card list">${data.activities.slice().reverse().slice(0,5).map(x=>`<div class="item"><div><strong>${esc(x.title)}</strong><small>${esc(x.description)} · ${fmt(x.date)}</small></div><span class="badge">${esc(x.category)}</span></div>`).join('')||'<div class="empty">Nenhuma atividade registrada.</div>'}</section>`;
if(page==='admins')c.innerHTML=`<div class="head"><div><h3>Administradores</h3><span class="muted">${s.total} cadastro(s)</span></div><button class="btn" onclick="openAdmin()">+ Adicionar administrador</button></div><div class="toolbar"><input id="search" placeholder="Buscar nome, ID ou Discord" oninput="filter()"><select id="roleFilter" onchange="filter()"><option value="">Todos os cargos</option>${ROLES.map(x=>`<option>${x}</option>`).join('')}</select><select id="statusFilter" onchange="filter()"><option value="">Todos os status</option><option>Ativo</option><option>Em ausência</option><option>Inativo</option></select></div><div class="tablewrap"><table><thead><tr><th>Administrador</th><th>ID</th><th>Discord</th><th>Cargo</th><th>Status</th><th>Ações</th></tr></thead><tbody id="adminRows">${data.admins.map(tableRow).join('')||'<tr><td colspan="6" class="empty">Nenhum cadastro.</td></tr>'}</tbody></table></div>`;
if(page==='calendar'){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();c.innerHTML=`<div class="head"><div><h3>Calendário de atividades</h3><span class="muted">${d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</span></div><button class="btn" onclick="openEvent()">+ Novo compromisso</button></div><section class="card"><div class="calendar">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="dayname">${x}</div>`).join('')}${'<div></div>'.repeat(first)}${Array.from({length:days},(_,i)=>{let dt=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,ev=data.events.filter(x=>x.date===dt);return `<div class="day"><b>${i+1}</b>${ev.map(x=>`<small>${esc(x.title)}</small>`).join('')}</div>`}).join('')}</div></section><div class="head"><h3>Compromissos</h3></div><div class="list">${data.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="item"><div><strong>${esc(x.title)}</strong><small>${fmt(x.date)} ${esc(x.time)} · ${esc(x.description)}</small></div><button class="btn del sm" onclick="del('events','${x.id}')">Excluir</button></div>`).join('')||'<div class="empty">Nenhum compromisso cadastrado.</div>'}</div>`}
if(page==='notes')c.innerHTML=`<div class="head"><div><h3>Anotações administrativas</h3><span class="muted">${s.notes} registro(s)</span></div><button class="btn" onclick="openNote()">+ Nova anotação</button></div><div class="list">${data.notes.slice().reverse().map(x=>`<section class="card"><div class="head" style="margin:0 0 8px"><span class="badge">${esc(x.category)}</span><button class="btn del sm" onclick="del('notes','${x.id}')">Excluir</button></div><strong>${esc(x.title)}</strong><p class="muted" style="white-space:pre-wrap">${esc(x.content)}</p><small class="muted">${fmt(x.date)} · ${esc(x.author)}</small></section>`).join('')||'<div class="empty">Nenhuma anotação cadastrada.</div>'}</div>`;
if(page==='activities')c.innerHTML=`<div class="head"><div><h3>Histórico de atividades</h3><span class="muted">${data.activities.length} registro(s)</span></div><button class="btn" onclick="openActivity()">+ Registrar atividade</button></div><div class="list">${data.activities.slice().reverse().map(x=>`<div class="item"><div><strong>${esc(x.title)}</strong><small>${esc(x.description)} · ${fmt(x.date)} · ${esc(x.author)}</small></div><span class="badge">${esc(x.category)}</span></div>`).join('')||'<div class="empty">Nenhuma atividade registrada.</div>'}</div>`;
if(page==='reports')c.innerHTML=`<div class="head"><h3>Relatórios gerais</h3><button class="btn warn" onclick="report()">Exportar CSV</button></div><div class="stats"><div class="stat"><small>ADMINISTRADORES</small><strong>${s.total}</strong></div><div class="stat"><small>ATIVOS</small><strong>${s.active}</strong></div><div class="stat"><small>EM AUSÊNCIA</small><strong>${s.absent}</strong></div><div class="stat"><small>INATIVOS</small><strong>${data.admins.filter(x=>x.status==='Inativo').length}</strong></div></div><section class="card"><h3>Distribuição por cargo</h3><div class="list">${ROLES.map(r=>`<div class="item"><strong>${r}</strong><span class="badge">${data.admins.filter(x=>x.role===r).length}</span></div>`).join('')}</div></section><section class="card" style="margin-top:14px"><h3>Outros registros</h3><p class="muted">Anotações: ${data.notes.length} · Compromissos: ${data.events.length} · Atividades: ${data.activities.length}</p></section>`;
if(page==='settings')c.innerHTML=`<section class="card"><h3>Identidade do painel</h3><div class="field"><label>Nome da comunidade</label><input id="community" value="${esc(data.settings.community)}"></div><button class="btn" onclick="saveSettings()">Salvar</button></section><section class="card" style="margin-top:14px"><h3>Backup e restauração</h3><p class="muted">Exporte uma cópia dos dados ou importe um arquivo de backup JSON.</p><div class="toolbar"><button class="btn warn" onclick="backup()">Exportar backup</button><button class="btn alt" onclick="$('importFile').click()">Importar backup</button></div><div class="notice">Os dados ficam neste navegador e dispositivo. Limpar os dados do navegador pode apagar seus registros. Faça backups regularmente.</div></section><section class="card" style="margin-top:14px"><h3>Segurança</h3><p class="muted">Altere a senha da conta principal.</p><button class="btn alt" onclick="changePassword()">Alterar senha</button></section><section class="card" style="margin-top:14px"><h3>Zona de risco</h3><button class="btn del" onclick="reset()">Apagar todos os dados locais</button></section>`;
}
function row(a){return `<div class="item"><div><strong>${esc(a.name)}</strong><small>${esc(a.role)} · ${esc(a.discord||'Sem Discord')}</small></div><span class="badge ${a.status==='Inativo'?'r':a.status==='Em ausência'?'y':''}">${esc(a.status)}</span></div>`}
function tableRow(a){return `<tr><td><b>${esc(a.name)}</b><br><span class="muted">${esc(a.observations)}</span></td><td>${esc(a.playerId||'—')}</td><td>${esc(a.discord||'—')}</td><td>${esc(a.role)}</td><td><span class="badge ${a.status==='Inativo'?'r':a.status==='Em ausência'?'y':''}">${esc(a.status)}</span></td><td><div class="actions"><button class="btn alt sm" onclick="openAdmin('${a.id}')">Editar</button><button class="btn del sm" onclick="del('admins','${a.id}')">Excluir</button></div></td></tr>`}
window.go=p=>{page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()};
window.filter=()=>{let q=$('search').value.toLowerCase(),r=$('roleFilter').value,s=$('statusFilter').value,arr=data.admins.filter(a=>(a.name+' '+a.playerId+' '+a.discord).toLowerCase().includes(q)&&(!r||a.role===r)&&(!s||a.status===s));$('adminRows').innerHTML=arr.map(tableRow).join('')||'<tr><td colspan="6" class="empty">Nenhum resultado.</td></tr>'};
function modal(title,body,fn){$('modalRoot').innerHTML=`<div class="modalbg" id="modalbg"><div class="modal"><div class="modalhead"><h3>${title}</h3><button class="btn alt sm" onclick="closeModal()">Fechar</button></div>${body}<div class="modalfoot"><button class="btn alt" onclick="closeModal()">Cancelar</button><button class="btn" id="saveModal">Salvar</button></div></div></div>`;$('modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()};$('saveModal').onclick=fn}
window.closeModal=()=>$('modalRoot').innerHTML='';
window.openAdmin=editId=>{let a=data.admins.find(x=>x.id===editId)||{name:'',playerId:'',discord:'',role:ROLES[0],status:'Ativo',observations:''};modal(editId?'Editar administrador':'Adicionar administrador',`<div class="formgrid"><div class="field"><label>Nome / Nick</label><input id="fName" value="${esc(a.name)}"></div><div class="field"><label>ID do jogador</label><input id="fId" value="${esc(a.playerId)}"></div><div class="field"><label>Discord</label><input id="fDiscord" value="${esc(a.discord)}"></div><div class="field"><label>Cargo</label><select id="fRole">${ROLES.map(r=>`<option ${r===a.role?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="fStatus">${['Ativo','Em ausência','Inativo'].map(r=>`<option ${r===a.status?'selected':''}>${r}</option>`).join('')}</select></div><div class="field span"><label>Observações</label><textarea id="fObs" rows="3">${esc(a.observations)}</textarea></div></div>`,()=>{let name=$('fName').value.trim();if(!name){toast('Informe o nome.');return}let obj={...a,id:a.id||id(),name,playerId:$('fId').value,discord:$('fDiscord').value,role:$('fRole').value,status:$('fStatus').value,observations:$('fObs').value};if(editId)data.admins=data.admins.map(x=>x.id===editId?obj:x);else data.admins.push(obj);data.activities.push({id:id(),title:(editId?'Cadastro atualizado: ':'Administrador cadastrado: ')+name,description:obj.role,category:'Equipe',date:today(),author:user});save();closeModal();render();toast('Administrador salvo.')})};
window.openEvent=()=>modal('Novo compromisso',`<div class="field"><label>Título</label><input id="fTitle"></div><div class="formgrid"><div class="field"><label>Data</label><input id="fDate" type="date" value="${today()}"></div><div class="field"><label>Horário</label><input id="fTime" type="time"></div></div><div class="field"><label>Descrição</label><textarea id="fDesc"></textarea></div>`,()=>{if(!$('fTitle').value.trim())return toast('Informe o título.');data.events.push({id:id(),title:$('fTitle').value,date:$('fDate').value,time:$('fTime').value,description:$('fDesc').value});save();closeModal();render();toast('Compromisso salvo.')});
window.openNote=()=>modal('Nova anotação',`<div class="field"><label>Título</label><input id="fTitle"></div><div class="field"><label>Categoria</label><select id="fCat"><option>Geral</option><option>Equipe</option><option>Advertência</option><option>Reunião</option><option>Planejamento</option></select></div><div class="field"><label>Conteúdo</label><textarea id="fContent" rows="5"></textarea></div>`,()=>{if(!$('fTitle').value.trim()||!$('fContent').value.trim())return toast('Preencha título e conteúdo.');data.notes.push({id:id(),title:$('fTitle').value,content:$('fContent').value,category:$('fCat').value,date:today(),author:user});save();closeModal();render();toast('Anotação salva.')});
window.openActivity=()=>modal('Registrar atividade',`<div class="field"><label>Atividade</label><input id="fTitle"></div><div class="field"><label>Categoria</label><select id="fCat"><option>Equipe</option><option>Reunião</option><option>Treinamento</option><option>Advertência</option><option>Operacional</option><option>Outro</option></select></div><div class="field"><label>Descrição</label><textarea id="fDesc"></textarea></div><div class="field"><label>Data</label><input id="fDate" type="date" value="${today()}"></div>`,()=>{if(!$('fTitle').value.trim())return toast('Informe a atividade.');data.activities.push({id:id(),title:$('fTitle').value,description:$('fDesc').value,category:$('fCat').value,date:$('fDate').value,author:user});save();closeModal();render();toast('Atividade registrada.')});
window.del=(collection,itemId)=>{if(!confirm('Excluir este registro?'))return;data[collection]=data[collection].filter(x=>x.id!==itemId);save();render();toast('Registro excluído.')};
window.saveSettings=()=>{data.settings.community=$('community').value.trim()||'Infinity City RP';save();toast('Configurações salvas.')};
function download(name,text,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function backup(){download('backup-icrp-'+today()+'.json',JSON.stringify({...data,backupCreatedAt:new Date().toISOString()},null,2),'application/json');toast('Backup exportado.')}
$('importFile').onchange=e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.account||!Array.isArray(x.admins)||!Array.isArray(x.notes)||!Array.isArray(x.events)||!Array.isArray(x.activities))throw Error('Arquivo não reconhecido');if(!confirm('Importar backup e substituir os dados atuais?'))return;data={account:x.account,admins:x.admins,notes:x.notes,events:x.events,activities:x.activities,settings:x.settings||{community:'Infinity City RP'}};save();user=data.account.username;$('who').textContent='Conectado: '+user;render();toast('Backup importado.')}catch(err){alert('Falha ao importar: '+err.message)}};r.readAsText(file);e.target.value=''};
window.report=()=>{let rows=[['Nome','ID','Discord','Cargo','Status','Observações'],...data.admins.map(a=>[a.name,a.playerId,a.discord,a.role,a.status,a.observations])],csv=rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\n');download('relatorio-icrp-'+today()+'.csv','\ufeff'+csv,'text/csv;charset=utf-8')};
window.changePassword=async()=>{let old=prompt('Digite sua senha atual:');if(old===null)return;if(await hash(old)!==data.account.hash)return alert('Senha atual incorreta.');let n=prompt('Digite a nova senha (mínimo 8 caracteres):');if(!n||n.length<8)return alert('Senha inválida.');let c=prompt('Confirme a nova senha:');if(n!==c)return alert('As senhas não coincidem.');data.account.hash=await hash(n);save();toast('Senha alterada.')};
window.reset=()=>{if(!confirm('Isso apagará todos os dados e a conta local. Deseja continuar?'))return;if(!confirm('Confirmação final: faça backup antes, se necessário.'))return;localStorage.removeItem(KEY);data=fresh();loginView()};
loginView();
})();
</script></body></html>
